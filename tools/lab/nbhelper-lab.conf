# CrossWax NasBuster — systemd drop-in for nbhelper in the cwnsb-lab WSL distro.
# Lab mode enforced by the root helper itself: only loop devices backed by files
# in /var/lib/cwnsb-lab can ever be partitioned or formatted, whatever
# nasbusterd asks.
[Service]
ExecStart=
ExecStart=/usr/libexec/cwnsb/nbhelper -allow-user cwnsb -idle-exit 2m -lab-dir /var/lib/cwnsb-lab
