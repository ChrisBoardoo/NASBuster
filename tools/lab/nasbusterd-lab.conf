# CrossWax NasBuster — systemd drop-in for the cwnsb-lab WSL distro.
# Lab mode: only loop devices under /var/lib/cwnsb-lab are usable; every other
# disk (Windows-side virtual disks, Docker ISOs) is reported as protected.
# Port 8443 is forwarded by WSL to https://localhost:8443 on Windows.
[Service]
ExecStart=
ExecStart=/usr/bin/nasbusterd -listen :8443 -data-dir /var/lib/cwnsb -helper-socket /run/cwnsb/helper.sock -lab-dir /var/lib/cwnsb-lab -log-level debug
AmbientCapabilities=
CapabilityBoundingSet=
